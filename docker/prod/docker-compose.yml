name: holy-child-prod

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: holy-child-prod-db
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db_backups:/backups
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - holy_child_network

  # Django Backend
  backend:
    build:
      context: ../../backend
      dockerfile: ../docker/prod/Dockerfile.backend
    image: holy-child-prod-backend
    container_name: holy-child-prod-backend
    restart: always
    volumes:
      - media-files:/app/media
      - static-files:/app/staticfiles
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8000), 2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - holy_child_network
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py seed_initial_data &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"

  # React Frontend (built assets, served by its own nginx)
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../docker/prod/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    image: holy-child-prod-frontend
    container_name: holy-child-prod-frontend
    restart: always
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - holy_child_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: holy-child-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf.template:ro
      - static-files:/var/www/static:ro
      - media-files:/var/www/media:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - holy_child_network
    command: >
      sh -c "sed 's/__DOMAIN__/${DOMAIN}/g' /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"

volumes:
  postgres-data:
  media-files:
  static-files:

networks:
  holy_child_network:
    driver: bridge
