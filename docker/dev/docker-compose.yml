name: holy-child-dev

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: holy-child-dev-db
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - holy_child_dev_network
    ports:
      # 5433 on the host so an already-installed PostgreSQL keeps 5432
      - "5433:5432"

  # Django Backend
  backend:
    build:
      context: ../../backend
      dockerfile: ../docker/dev/Dockerfile.backend
    image: holy-child-dev-backend
    container_name: holy-child-dev-backend
    restart: always
    volumes:
      - ../../backend:/app
      - media-files:/app/media
      - static-files:/app/staticfiles
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - holy_child_dev_network
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py seed_initial_data &&
             python manage.py runserver 0.0.0.0:8000"

  # React Frontend (Vite dev server)
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../docker/dev/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    image: holy-child-dev-frontend
    container_name: holy-child-dev-frontend
    restart: always
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - holy_child_dev_network
    command: >
      sh -c "if [ ! -f node_modules/.bin/vite ]; then
               echo 'Vite binary not found, running npm install...'
               npm install
             fi
             npm run dev -- --host 0.0.0.0"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: holy-child-dev-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static-files:/var/www/static:ro
      - media-files:/var/www/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - holy_child_dev_network

volumes:
  postgres-data:
  media-files:
  static-files:

networks:
  holy_child_dev_network:
    driver: bridge
